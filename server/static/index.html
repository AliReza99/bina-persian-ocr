<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bina OCR</title>
<style>
  :root { --bg:#f6f6f4; --fg:#1d1d1b; --muted:#6b6b66; --card:#fff; --line:#ddd; --accent:#2f6fde; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#ececea; --muted:#9a9a94; --card:#20201e; --line:#3a3a37; --accent:#6b9cf0; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, "Vazirmatn", Tahoma, sans-serif; }
  main { max-width:1200px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:0 0 12px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px; }
  button, select, label.file { font:inherit; padding:6px 14px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  #status { color:var(--muted); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:800px) { .grid { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; min-height:200px; }
  img { max-width:100%; display:block; margin:auto; }
  #out { width:100%; min-height:60vh; border:0; resize:vertical; background:transparent; color:inherit; font:inherit; line-height:1.9; }
  .warn { color:#c2410c; }
</style>
</head>
<body>
<main>
  <h1>Bina OCR</h1>
  <div class="bar">
    <label class="file">انتخاب تصویر<input id="file" type="file" accept="image/*" hidden></label>
    <select id="task"><option value="ocr">متن ساده</option><option value="markup">Markdown</option></select>
    <button id="run" class="primary" disabled>استخراج متن</button>
    <button id="copy" disabled>کپی</button>
    <span id="status" role="status"></span>
    <a href="/docs" style="margin-inline-start:auto;color:var(--muted)">API docs</a>
  </div>
  <div class="grid">
    <div class="card"><img id="preview" alt=""></div>
    <div class="card"><textarea id="out" readonly aria-label="متن استخراج‌شده"></textarea></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let file = null;

$('file').onchange = () => {
  file = $('file').files[0] || null;
  if (!file) return;
  $('preview').src = URL.createObjectURL(file);
  $('preview').alt = file.name;
  $('out').value = '';
  $('status').textContent = file.name;
  $('run').disabled = false;
  $('run').click();
};

$('run').onclick = async () => {
  $('run').disabled = $('copy').disabled = true;
  $('status').className = '';
  $('status').textContent = 'در حال پردازش…';
  try {
    const res = await fetch('/ocr?task=' + $('task').value, { method: 'POST', body: file });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.status);
    $('out').value = data.text;
    $('status').textContent = data.seconds + ' ثانیه' + (data.incomplete ? ' (بخشی از متن ممکن است ناقص باشد)' : '');
    if (data.incomplete) $('status').className = 'warn';
    $('copy').disabled = false;
  } catch (e) {
    $('status').className = 'warn';
    $('status').textContent = 'خطا: ' + e.message;
  }
  $('run').disabled = false;
};

$('copy').onclick = () => navigator.clipboard.writeText($('out').value);
</script>
</body>
</html>
